<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#141626">
  <meta name="description" content="Browse websites supported by the Flux directory.">
  <title>Flux — Supported Sites</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/kutuzovdaniel579-jpg/Flux-Reborn/main/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script src="../preferences.js" defer></script>
  <script src="sites.js" defer></script>
</head>
<body data-theme="dark">
  <header class="topbar">
    <a class="about-link" href="../../index.html">Home</a>
    <a class="about-link" href="index.html" aria-current="page">Supported sites</a>
    <a class="about-link" href="../settings/index.html">Settings</a>
  </header>

  <main class="search-results-page">
    <h1 class="results-heading">Supported websites</h1>
    <label class="visually-hidden" for="site-search">Check if a website is supported</label>
    <input class="site-search" id="site-search" type="search" placeholder="Search websites..." autocomplete="off">
    <p class="site-search-status" id="site-search-status" aria-live="polite">Type a website name to check if it’s supported.</p>
    <div class="results" id="supported-sites" aria-live="polite"></div>
  </main>

  <footer>
    <span>© <span id="year"></span> Flux</span>
    <span class="footer-note">Search starts here.</span>
  </footer>
</body>
</html>
