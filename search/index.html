<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#141626">
  <meta name="description" content="Search the Flux directory.">
  <title>Flux — Search Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script src="../preferences.js" defer></script>
  <script src="../script.js" defer></script>
</head>
<body data-theme="dark">
  <header class="topbar">
    <a class="about-link" href="../index.html">Home</a>
    <a class="about-link" href="../flux/sites/index.html">Supported sites</a>
    <a class="about-link" href="../flux/settings/index.html">Settings</a>
  </header>

  <main class="search-results-page">
    <h1 class="results-heading">Search Flux</h1>
    <form class="search-form results-page-form" role="search">
      <label class="visually-hidden" for="search-input">Search Flux sites</label>
      <span class="search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
      </span>
      <select class="search-site" id="search-site" aria-label="Choose a supported website">
        <option value="">All supported websites</option>
      </select>
      <input id="search-input" name="q" type="search" placeholder="Search anything..." autocomplete="off" required>
      <button class="search-button" type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </button>
    </form>
    <section class="results" id="search-results" aria-live="polite" aria-label="Search results" hidden></section>
  </main>

  <footer>
    <span>© <span id="year"></span> Flux</span>
    <span class="footer-note">Search starts here.</span>
  </footer>
</body>
</html>
